<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let colours = ["red","orange","yellow","green"];

        let joinedcolours = colours.join(" - ");

        let popcolours = colours.pop();

        colours.push("blue");

        document.write(joinedcolours + "<br>" + popcolours + "<br>" );
        document.write(colours);
    </script>
</body>
</html>
